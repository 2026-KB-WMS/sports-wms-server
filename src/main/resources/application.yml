spring:
  application:
    name: wms-server

  datasource:
    url: jdbc:mysql://localhost:3306/wms?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: wms
    password: wms
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    time-zone: Asia/Seoul

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# 액세스 토큰(HS256) 서명 키는 32바이트 이상이어야 한다. 아래 값은 로컬 개발용이다.
wms:
  jwt:
    secret: local-dev-only-jwt-secret-key-change-me-0123456789
    access-token-validity-seconds: 3600

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

wms:
  jwt:
    secret: ${JWT_SECRET}
