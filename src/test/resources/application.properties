spring.datasource.url=jdbc:h2:mem:wms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
wms.jwt.secret=test-only-jwt-secret-key-0123456789-0123456789
wms.jwt.access-token-validity-seconds=3600
